name: ORM and Admin regression tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  sqlite-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[standard,admin]" pytest pytest-asyncio pytest-timeout httpx
      - run: python -m pytest -o addopts='' tests/cli/test_starter.py tests/unit/test_project_settings.py tests/integration/test_orm_management.py tests/integration/test_orm_isolation.py tests/integration/test_cms_course_security.py tests/security/test_admin_data_boundaries.py -q
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: flaxon_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[standard,postgres]" pytest pytest-asyncio pytest-timeout
      - run: python -m pytest -o addopts='' tests/integration/test_orm_postgres.py -q
        env:
          FLAXON_TEST_POSTGRES_URL: postgres://postgres@127.0.0.1:5432/flaxon_test
