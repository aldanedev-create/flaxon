name: ORM and Admin regression tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  sqlite-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[standard,admin]" pytest pytest-asyncio pytest-timeout httpx
      - run: python -m pytest -o addopts='' tests/cli/test_starter.py tests/unit/test_project_settings.py tests/integration/test_orm_management.py tests/integration/test_orm_isolation.py tests/integration/test_admin_orm_experience.py tests/integration/test_cms_course_security.py tests/security/test_admin_data_boundaries.py -q
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: flaxon_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[standard,postgres]" pytest pytest-asyncio pytest-timeout
      - run: python -m pytest -o addopts='' tests/integration/test_orm_postgres.py -q
        env:
          FLAXON_TEST_POSTGRES_URL: postgres://postgres@127.0.0.1:5432/flaxon_test

  browser-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[standard,admin]" pytest pytest-asyncio pytest-timeout httpx playwright==1.51.0
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -o addopts='' tests/browser/test_orm_admin_browser.py tests/browser/test_admin_cms_browser.py -q

  request-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[standard,admin]" pytest pytest-asyncio pytest-timeout httpx ruff "mypy>=1.10,<2"
      - run: python -m pytest -o addopts='' tests/unit/test_json_contract.py tests/security tests/expanded/security tests/expanded/state tests/integration/test_authentication.py -q
      - run: ruff check --select E9,F63,F7,F82 src/flaxon
      - run: mypy --no-incremental --follow-imports=skip src/flaxon/routing/execution.py src/flaxon/security/jwt.py src/flaxon/http/serialization.py
