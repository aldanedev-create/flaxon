name: ORM and Admin regression tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  sqlite-admin:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[standard,admin]" pytest pytest-asyncio pytest-timeout httpx
      - run: python -m pytest -o addopts='' tests/cli/test_starter.py tests/unit/test_project_settings.py tests/integration/test_orm_management.py tests/integration/test_orm_isolation.py tests/integration/test_admin_orm_experience.py tests/integration/test_cms_course_security.py tests/security/test_admin_data_boundaries.py -q
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: flaxon_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[standard,postgres]" pytest pytest-asyncio pytest-timeout
      - run: python -m pytest -o addopts='' tests/integration/test_orm_postgres.py -q
        env:
          FLAXON_TEST_POSTGRES_URL: postgres://postgres@127.0.0.1:5432/flaxon_test

  browser-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[standard,admin]" pytest pytest-asyncio pytest-timeout httpx playwright==1.51.0
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -o addopts='' tests/browser/test_orm_admin_browser.py tests/browser/test_admin_cms_browser.py -q

  request-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[standard,admin,pydantic]" pytest pytest-asyncio pytest-timeout httpx ruff==0.16.10 "mypy==1.20.2"
      - run: python -m pytest -o addopts='' tests/unit/test_release_tooling.py tests/unit/test_json_contract.py tests/unit/test_router_index.py tests/unit/test_exception_boundaries.py tests/unit/test_quality_budget.py tests/unit/test_context_isolation.py tests/test_quality_cleanup_security.py tests/security tests/expanded/security tests/expanded/state tests/integration/test_authentication.py tests/integration/test_response_filtering.py -q
      - run: ruff check src/flaxon
      - run: python scripts/check_lint_budget.py
      - run: python scripts/typecheck.py

  release-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: python scripts/build.py --clean --check
      - run: python scripts/verify_wheel.py dist/*.whl
