name: Project creation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cli:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[standard,admin]" pytest
      - run: python -m pytest -o addopts='' tests/cli/test_cli.py tests/cli/test_new_environment.py -q
