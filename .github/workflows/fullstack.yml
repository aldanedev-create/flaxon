name: Full-stack integration
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  head-and-typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install framework and current Teloce compiler
        run: |
          python -m pip install "git+https://github.com/aldanedev-create/teloce-py.git" "minifyjs>=0.1.3,<0.2" pyyaml jinja2 uvicorn pytest pytest-asyncio pytest-timeout pytest-cov playwright aiosqlite
          python -m pip install -e ".[standard,admin]" httpx
          python -m playwright install --with-deps chromium
      - name: Test project starter, Python integration, and browser behavior
        env:
          FLAXON_BROWSER_TESTS: '1'
        run: python -m pytest -o addopts='' tests/cli tests/integration/test_teloce_integration.py tests/integration/test_teloce_head_browser.py tests/integration/test_documentation_examples.py tests/integration/test_http_lifecycle.py -q
