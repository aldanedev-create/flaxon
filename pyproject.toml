[build-system]
requires = ["setuptools>=75.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flaxon"
description = "A technology-neutral, async-first Python backend framework"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Aldane Hutchinson", email = "aldanehutchinson5@gmail.com"},
]
maintainers = [
    {name = "Aldane Hutchinson", email = "aldanehutchinson5@gmail.com"},
]
keywords = [
    "python",
    "framework",
    "web",
    "backend",
    "asgi",
    "async",
    "api",
    "websocket",
    "rest",
    "json",
    "yaml",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Framework :: AsyncIO",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# Added PyYAML to core dependencies
dependencies = [
    "pyyaml>=6.0.0",
]
dynamic = ["version"]

[project.optional-dependencies]
yaml = [
    "pyyaml>=6.0.0",
]
server = [
    "uvicorn>=0.30.0",
]
templates = [
    "jinja2>=3.1.0",
]
standard = [
    "uvicorn>=0.30.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0.0",
]

# Optional integrations used by the Admin/CMS production features. Install
# only the groups used by an application, or use ``flaxon[production]`` for a
# complete deployment baseline.
admin = [
    "nh3>=0.2.17",
    "Pillow>=10.0.0",
    "python-magic>=0.4.27",
    "argon2-cffi>=23.1.0",
    "webauthn>=2.0.0",
]
policy = [
    "casbin>=1.40.0",
]
scheduler = [
    "APScheduler>=3.10.4",
]
production = [
    "nh3>=0.2.17",
    "Pillow>=10.0.0",
    "python-magic>=0.4.27",
    "argon2-cffi>=23.1.0",
    "webauthn>=2.0.0",
    "casbin>=1.40.0",
    "APScheduler>=3.10.4",
    "redis>=5.0.0",
]

dev = [
    
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-xdist>=3.5.0",
    "pytest-timeout>=2.3.0",
    "aiosqlite>=0.20.0",
    "redis>=5.0.0",         
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "types-pyyaml>=6.0.0", # Added stubs for mypy strict typing
    "build>=1.2.0",
    "twine>=5.0.0",
    "tox>=4.15.0",
    "bandit>=1.7.9",
    "pip-audit>=2.7.3",
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocs-autorefs>=1.3.0",
    "mkdocstrings>=0.25.0",
    "mkdocstrings-python>=1.10.0",
    "mkdocs-minify-plugin>=0.8.0",
]

security = [
    "cryptography>=42.0.0",
    "qrcode[pil]>=7.4.0",
]

docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocs-autorefs>=1.3.0",
    "mkdocstrings>=0.25.0",
    "mkdocstrings-python>=1.10.0",
    "mkdocs-minify-plugin>=0.8.0",
]
benchmark = [
    "pytest-benchmark>=4.0.0",
]

[project.scripts]
flaxon = "flaxon.cli.main:main"

[project.urls]
Homepage = "https://github.com/aldanedev-create/Flaxon-Backend-Framework"
Repository = "https://github.com/aldanedev-create/Flaxon-Backend-Framework"
"Bug Tracker" = "https://github.com/aldanedev-create/Flaxon-Backend-Framework/issues"
Changelog = "https://github.com/aldanedev-create/Flaxon-Backend-Framework/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = {"" = "src"}
packages = {find = {where = ["src"]}}
include-package-data = true

[tool.setuptools.package-data]
flaxon = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "flaxon.__version__"}

[tool.black]
line-length = 110
target-version = ["py311", "py312", "py313"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src"]
extend-exclude = [
    ".venv/",
    ".tox/",
    "build/",
    "dist/",
    "*.egg-info/",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "D",   # pydocstyle
    "SIM", # flake8-simplify
    "PL",  # pylint
    "RUF", # ruff specific
]
ignore = [
    "D100",   # Missing docstring in public module
    "D104",   # Missing docstring in public package
    "D105",   # Missing docstring in magic method
    "D107",   # Missing docstring in __init__
    "D203",   # 1 blank line required before class docstring
    "D212",   # Multi-line docstring summary should start at the first line
    "D401",   # First line of docstring should be in imperative mood
    "PLR0913", # Too many arguments
    "PLR2004", # Magic number
    "B008",   # Do not perform function calls in argument defaults
    "B904",   # Raise from None
    "SIM117", # Combine with statements
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "D", "I001", "I002", "I003"]
"tests/**/*.py" = ["D", "PLR", "B", "S", "SIM"]
"examples/**/*.py" = ["D", "PLR", "B", "S", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
target_platform = "linux"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
strict_optional = true
warn_no_return = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
ignore_missing_imports = false
no_implicit_optional = true
strict_equality = true
show_error_codes = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
]
exclude = [
    "^build/",
    "^dist/",
    "^.venv/",
    "^.tox/",
    "^tests/",
    "^examples/",
    "^docs/.*", 
]


[[tool.mypy.overrides]]
module = "flaxon.jinax.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "--cov=flaxon",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--no-cov-on-fail",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Unit tests (default)",
    "integration: Integration tests",
    "security: Security tests",
    "performance: Performance tests",
    "slow: Slow running tests",
    "asyncio: Async tests",
]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
branch = true
source_pkgs = ["flaxon"]
parallel = true
concurrency = ["thread", "multiprocessing"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
omit = [
    "tests/*",
    "examples/*",
    "**/__init__.py",
    "**/__main__.py",
]
show_missing = true
precision = 2
fail_under = 80

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[tool.tox]
legacy_tox_ini = """
[tox]
env_list =
    py311
    py312
    py313
    lint
    type-check
min_version = 4.0

[testenv]
description = Run the test suite under Python {envname}
deps =
    -e .[standard,dev]
commands =
    pytest {posargs}

[testenv:lint]
description = Run ruff linter
deps =
    ruff>=0.5.0
commands =
    ruff check .

[testenv:type-check]
description = Run mypy type checker
deps =
    mypy>=1.10.0
    -e .[standard,dev]
commands =
    mypy .

[testenv:format]
description = Run ruff formatter
deps =
    ruff>=0.5.0
commands =
    ruff format --check .
"""

[tool.pytest-benchmark]
group_by = "group"
histogram = true
warmup = true
warmup_iterations = 10
rounds = 100
