[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flaxon-admin-rating"
version = "0.1.0"
description = "Star-rating field, card and page for the Flaxon admin, built with Teloce"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["flaxon>=0.3.2", "teloce-py>=0.3.4"]

[project.entry-points."flaxon.admin"]
rating = "flaxon_admin_rating:RatingExtension"

[tool.setuptools.packages.find]
include = ["flaxon_admin_rating*"]

[tool.setuptools.package-data]
flaxon_admin_rating = ["ui/*.vel"]
