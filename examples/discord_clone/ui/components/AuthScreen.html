<template>
  <div class="auth">
    <div class="auth-card">
      <h1>Discord Clone</h1>
      <p class="subtitle">A teaching system-design course built on Flaxon + Teloce.</p>

      <div class="tabs">
        <button :class="{ active: mode === 'login' }" @click="mode = 'login'">Log in</button>
        <button :class="{ active: mode === 'register' }" @click="mode = 'register'">Register</button>
      </div>

      <form @submit.prevent="submit">
        <label v-if="mode === 'register'">
          Email
          <input v-model="email" type="email" autocomplete="email" required>
        </label>
        <label>
          Username
          <input v-model="username" type="text" autocomplete="username" required>
        </label>
        <label>
          Password
          <input v-model="password" type="password" autocomplete="current-password" required>
        </label>

        <p v-if="error" class="error">{{ error }}</p>
        <button type="submit" :disabled="busy">{{ busy ? "Working…" : (mode === 'login' ? 'Log in' : 'Create account') }}</button>
      </form>
    </div>
  </div>
</template>

<script lang="ts">
import { auth } from "../api.ts";
import type { User } from "../types.ts";

export default {
  data() {
    return {
      mode: "login" as "login" | "register",
      username: "",
      email: "",
      password: "",
      busy: false,
      error: "",
    };
  },
  methods: {
    async submit() {
      if (this.busy) return;
      this.busy = true;
      this.error = "";
      try {
        const result =
          this.mode === "login"
            ? await auth.login(this.username, this.password)
            : await auth.register(this.username, this.email, this.password);
        this.$emit("authenticated", (result as { user: User }).user);
      } catch (e) {
        this.error = (e as Error).message;
      } finally {
        this.busy = false;
      }
    },
  },
};
</script>
