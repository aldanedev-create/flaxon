<template>
  <nav class="servers">
    <button
      v-for="server in servers"
      :key="server.id"
      class="server-icon"
      :class="{ active: server.id === currentServerId }"
      :style="{ background: server.icon_color }"
      :title="server.name"
      @click="$emit('select', server.id)"
    >{{ initial(server.name) }}</button>

    <button class="server-icon add" title="Create a server" @click="creating = !creating">+</button>

    <div v-if="creating" class="popover">
      <h4>Create or join</h4>
      <label>New server name
        <input v-model="newName" @keyup.enter="create" placeholder="My Server">
      </label>
      <button @click="create" :disabled="!newName.trim()">Create</button>
      <hr>
      <label>Invite code
        <input v-model="invite" @keyup.enter="join" placeholder="abc123">
      </label>
      <button @click="join" :disabled="!invite.trim()">Join</button>
      <p v-if="error" class="error">{{ error }}</p>
    </div>
  </nav>
</template>

<script lang="ts">
import { servers } from "../api.ts";
import type { ServerPublic } from "../types.ts";

export default {
  props: ["servers", "currentServerId"],
  data() {
    return {
      creating: false,
      newName: "",
      invite: "",
      error: "",
    };
  },
  methods: {
    initial(name: string): string {
      return (name || "?").trim().charAt(0).toUpperCase();
    },
    async create() {
      this.error = "";
      try {
        const res = await servers.create(this.newName.trim());
        this.newName = "";
        this.creating = false;
        this.$emit("created", (res as { server: ServerPublic }).server);
      } catch (e) {
        this.error = (e as Error).message;
      }
    },
    async join() {
      this.error = "";
      try {
        await servers.join(this.invite.trim());
        this.invite = "";
        this.creating = false;
        this.$emit("joined");
      } catch (e) {
        this.error = (e as Error).message;
      }
    },
  },
};
</script>
