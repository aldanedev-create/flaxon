<template>
  <aside class="channels">
    <header class="server-header">
      <span class="server-name">{{ serverName }}</span>
      <button class="icon-btn" title="New channel" @click="creating = !creating">+</button>
    </header>

    <div v-if="creating" class="channel-form">
      <input v-model="newName" @keyup.enter="create" placeholder="channel-name" />
      <input v-model="newTopic" placeholder="topic (optional)" />
      <label class="private">
        <input type="checkbox" v-model="newPrivate" /> Private
      </label>
      <button @click="create" :disabled="!newName.trim()">Create</button>
      <p v-if="error" class="error">{{ error }}</p>
    </div>

    <ul class="channel-list">
      <li
        v-for="channel in channels"
        :key="channel.id"
        :class="{ active: channel.id === currentChannelId }"
        @click="$emit('select', channel.id)"
      >
        <span class="hash">#</span>{{ channel.name }}
        <span v-if="channel.is_private" class="lock" title="Private">🔒</span>
      </li>
      <li v-if="channels.length === 0" class="empty">No channels yet</li>
    </ul>
  </aside>
</template>

<script lang="ts">
import { servers } from "../api.ts";
import type { ChannelPublic } from "../types.ts";

export default {
  props: ["serverName", "channels", "currentChannelId", "serverId"],
  data() {
    return {
      creating: false,
      newName: "",
      newTopic: "",
      newPrivate: false,
      error: "",
    };
  },
  methods: {
    async create() {
      this.error = "";
      try {
        const res = await servers.createChannel(
          this.serverId,
          {
            name: this.newName.trim().toLowerCase(),
            topic: this.newTopic.trim(),
            is_private: this.newPrivate,
          },
        );
        this.newName = "";
        this.newTopic = "";
        this.newPrivate = false;
        this.creating = false;
        this.$emit("created", (res as { channel: ChannelPublic }).channel);
      } catch (e) {
        this.error = (e as Error).message;
      }
    },
  },
};
</script>
