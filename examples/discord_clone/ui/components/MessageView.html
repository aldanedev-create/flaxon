<template>
  <section class="chat">
    <header class="chat-header">
      <span class="hash">#</span>
      <span class="channel-name">{{ channelName }}</span>
      <span v-if="channelTopic" class="topic">— {{ channelTopic }}</span>
      <button class="bots-btn" @click="$emit('open-bots')">🤖 Bots</button>
    </header>

    <div class="messages" ref="scroller">
      <div v-if="messages.length === 0" class="empty">
        No messages yet. Say hello!
      </div>
      <div
        v-for="msg in messages"
        :key="msg.id"
        class="message"
        :class="{ own: msg.author_id === currentUser.id }"
      >
        <span class="avatar" :style="avatarStyle(msg)">{{ initial(nameOf(msg)) }}</span>
        <div class="body">
          <div class="meta">
            <span class="author" :style="{ color: nameOf(msg).color }">{{ nameOf(msg).name }}</span>
            <span class="time">{{ formatTime(msg.created_at) }}</span>
          </div>
          <div class="content">{{ msg.content }}</div>
        </div>
        <button
          v-if="msg.author_id === currentUser.id"
          class="delete"
          title="Delete"
          @click="$emit('delete', msg.id)"
        >✕</button>
      </div>
    </div>

    <div v-if="typingNames.length" class="typing">{{ typingNames.join(", ") }} typing…</div>

    <form class="composer" @submit.prevent="send">
      <input
        v-model="draft"
        :placeholder="'Message #' + channelName"
        @input="$emit('typing')"
      />
      <button type="submit" :disabled="!draft.trim()">Send</button>
    </form>
  </section>
</template>

<script lang="ts">
import type { MessagePublic, User } from "../types.ts";

export default {
  props: ["messages", "currentUser", "channelName", "channelTopic", "typingNames", "nameById"],
  data() {
    return { draft: "" };
  },
  updated() {
    const el = this.$refs.scroller as HTMLElement | undefined;
    if (el) el.scrollTop = el.scrollHeight;
  },
  methods: {
    initial(name: string): string {
      return (name || "?").charAt(0).toUpperCase();
    },
    nameOf(msg: MessagePublic): { name: string; color: string } {
      const id = msg.author_id ?? msg.author_bot_id;
      const entry = id != null ? (this.nameById as Record<number, { name: string; color: string }>)[id] : undefined;
      if (entry) return entry;
      return msg.author_bot_id != null
        ? { name: "Bot", color: "#5865f2" }
        : { name: "Unknown", color: "#80848e" };
    },
    avatarStyle(msg: MessagePublic): Record<string, string> {
      return { background: this.nameOf(msg).color };
    },
    formatTime(iso: string | null): string {
      if (!iso) return "";
      const d = new Date(iso);
      return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    },
    send() {
      const content = this.draft.trim();
      if (!content) return;
      this.$emit("send", content);
      this.draft = "";
    },
  },
};
</script>
