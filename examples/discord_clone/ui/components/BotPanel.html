<template>
  <div class="bot-overlay" @click.self="$emit('close')">
    <div class="bot-panel">
      <header>
        <h3>Bot platform</h3>
        <button class="close" @click="$emit('close')">✕</button>
      </header>

      <div class="create">
        <input v-model="name" placeholder="Bot name" @keyup.enter="createBot" />
        <input v-model="description" placeholder="Description (optional)" />
        <button @click="createBot" :disabled="!name.trim() || busy">Create bot</button>
      </div>
      <p v-if="token" class="token">New token (shown once): <code>{{ token }}</code></p>
      <p v-if="error" class="error">{{ error }}</p>

      <ul class="bot-list">
        <li v-for="bot in bots" :key="bot.id">
          <div class="bot-head">
            <strong>{{ bot.name }}</strong>
            <span class="desc">{{ bot.description }}</span>
          </div>
          <div class="bot-actions">
            <button @click="join(bot)">Add to server</button>
            <button @click="subscribe(bot)">Subscribe msg.create</button>
            <button @click="addCommand(bot)">Add /ping cmd</button>
            <button @click="invoke(bot)">Run /ping here</button>
            <button @click="showTokens(bot)" class="ghost">Tokens</button>
          </div>
          <ul v-if="selected === bot.id" class="tokens">
            <li v-for="t in tokenList" :key="t.id">
              <code>{{ t.prefix }}…</code>
              <span v-if="t.revoked" class="revoked">revoked</span>
              <button v-else class="ghost" @click="revoke(bot, t)">revoke</button>
            </li>
            <li v-if="tokenList.length === 0" class="empty">No tokens</li>
          </ul>
        </li>
        <li v-if="bots.length === 0" class="empty">You have no bots yet.</li>
      </ul>
    </div>
  </div>
</template>

<script lang="ts">
import { bots as botApi } from "../api.ts";
import type { BotPublic, BotTokenView } from "../types.ts";

export default {
  props: ["serverId", "channelId"],
  data() {
    return {
      bots: [] as BotPublic[],
      name: "",
      description: "",
      busy: false,
      token: "",
      error: "",
      selected: null as number | null,
      tokenList: [] as BotTokenView[],
    };
  },
  async mounted() {
    await this.load();
  },
  methods: {
    async load() {
      try {
        const res = await botApi.list();
        this.bots = (res as { items: BotPublic[] }).items;
      } catch (e) {
        this.error = (e as Error).message;
      }
    },
    async createBot() {
      this.busy = true;
      this.error = "";
      this.token = "";
      try {
        const res = await botApi.create(this.name.trim(), this.description.trim());
        const data = res as { bot: BotPublic; token: string };
        this.token = data.token;
        this.name = "";
        this.description = "";
        await this.load();
      } catch (e) {
        this.error = (e as Error).message;
      } finally {
        this.busy = false;
      }
    },
    async join(bot: BotPublic) {
      try {
        await botApi.joinServer(bot.id, this.serverId);
        this.error = "";
      } catch (e) {
        this.error = (e as Error).message;
      }
    },
    async subscribe(bot: BotPublic) {
      try {
        await botApi.createSubscription(bot.id, { event_type: "message.create", is_enabled: true });
      } catch (e) {
        this.error = (e as Error).message;
      }
    },
    async addCommand(bot: BotPublic) {
      try {
        await botApi.createCommand(bot.id, {
          name: "ping",
          description: "Replies with pong",
          is_enabled: true,
        });
      } catch (e) {
        this.error = (e as Error).message;
      }
    },
    async invoke(bot: BotPublic) {
      try {
        const res = await botApi.invoke(bot.id, {
          channel_id: this.channelId,
          command: "ping",
          args: [],
        });
        const data = res as { messages: unknown[] };
        this.error = data.messages.length ? "" : "Bot did not respond.";
      } catch (e) {
        this.error = (e as Error).message;
      }
    },
    async showTokens(bot: BotPublic) {
      this.selected = this.selected === bot.id ? null : bot.id;
      if (this.selected === null) return;
      try {
        const res = await botApi.tokens(bot.id);
        this.tokenList = (res as { items: BotTokenView[] }).items;
      } catch (e) {
        this.error = (e as Error).message;
      }
    },
    async revoke(bot: BotPublic, token: BotTokenView) {
      try {
        await botApi.revokeToken(bot.id, token.id);
        await this.showTokens(bot);
      } catch (e) {
        this.error = (e as Error).message;
      }
    },
  },
};
</script>
