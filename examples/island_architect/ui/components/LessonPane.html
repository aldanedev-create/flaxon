<template>
  <div class="lessons">
    <nav class="lesson-nav" aria-label="Lessons">
      <button v-for="lesson in lessons" :key="lesson.id"
              :class="open === lesson.id ? 'chip chip-on' : 'chip'"
              @click="open = lesson.id">{{ lesson.title }}</button>
    </nav>

    <article class="lesson">
      <h2>{{ current.title }}</h2>
      <p class="blurb">{{ current.blurb }}</p>

      <ol class="steps">
        <li v-for="step in current.steps" :key="step.label">
          <strong>{{ step.label }}</strong>
          <span>{{ step.detail }}</span>
        </li>
      </ol>

      <h3>{{ current.code.label }}</h3>
      <pre><code>{{ current.code.source }}</code></pre>

      <h3>Common mistakes</h3>
      <ul class="pitfalls">
        <li v-for="pitfall in current.pitfalls" :key="pitfall">{{ pitfall }}</li>
      </ul>
    </article>
  </div>
</template>

<script>
export default {
  props: ["lessons"],
  data() {
    return { open: (this.lessons && this.lessons[0] && this.lessons[0].id) || "" };
  },
  computed: {
    current() {
      const found = (this.lessons || []).find((lesson) => lesson.id === this.open);
      return found || (this.lessons || [])[0] || { title: "", blurb: "", steps: [], pitfalls: [], code: { label: "", source: "" } };
    },
  },
};
</script>
