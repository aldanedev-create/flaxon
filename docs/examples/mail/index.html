<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Contact Us</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 420px; margin: 60px auto; padding: 0 1rem; }
    label { display: block; margin-top: 12px; font-weight: 600; }
    input, textarea { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
    button { margin-top: 16px; padding: 10px 16px; cursor: pointer; }
    #status { margin-top: 12px; }
  </style>
</head>
<body>
  <h1>Contact Us</h1>
  <form id="contact-form">
    <label>Name<input type="text" id="name" required /></label>
    <label>Email<input type="email" id="email" required /></label>
    <label>Message<textarea id="message" rows="5" required></textarea></label>
    <button type="submit">Send</button>
  </form>
  <p id="status"></p>

  <script>
    const form = document.getElementById("contact-form");
    const status = document.getElementById("status");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      status.textContent = "Sending...";

      const payload = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        message: document.getElementById("message").value,
      };

      try {
        const res = await fetch("/api/contact", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });

        if (res.ok) {
          status.textContent = "Message sent!";
          form.reset();
        } else {
          const err = await res.json().catch(() => ({}));
          status.textContent = "Error: " + (err.error?.message || "Request failed");
        }
      } catch (err) {
        status.textContent = "Network error: " + err.message;
      }
    });
  </script>
</body>
</html>
