[tox]
env_list =
    py311
    py312
    py313
    lint
    type-check
    format-check
    docs
min_version = 4.0
skip_missing_interpreters = true

[testenv]
description = Run the test suite under Python {envname}
deps =
    -e .[standard,dev]
    pytest-cov
    pytest-asyncio
    pytest-xdist
setenv =
    PYTHONUNBUFFERED = 1
    PYTHONDONTWRITEBYTECODE = 1
commands =
    pytest -n auto --cov=flaxon --cov-report=term-missing {posargs}

[testenv:lint]
description = Run ruff linter
deps =
    ruff==0.16.10
commands =
    python scripts/check_lint_budget.py

[testenv:type-check]
description = Run mypy type checker
deps =
    mypy>=1.10,<2
    -e .[standard,dev]
commands =
    python scripts/typecheck.py

[testenv:format-check]
description = Run ruff formatter in check mode
deps =
    ruff==0.16.10
commands =
    ruff format --check .

[testenv:docs]
description = Build documentation
deps =
    -e .[docs]
commands =
    mkdocs build

[testenv:security]
description = Run security checks
deps =
    bandit>=1.7.0
    -e .[standard]
commands =
    bandit -r src/flaxon -f json -o bandit-report.json

[testenv:benchmark]
description = Run performance benchmarks
deps =
    -e .[standard,benchmark]
commands =
    pytest tests/performance/ --benchmark-only

[testenv:coverage]
description = Generate coverage report
deps =
    -e .[standard,dev]
commands =
    pytest --cov=flaxon --cov-report=term-missing --cov-report=html --cov-report=xml

[testenv:clean]
description = Clean all build artifacts
skip_install = true
deps =
commands =
    rm -rf build/ dist/ *.egg-info .pytest_cache/ .mypy_cache/ .ruff_cache/ htmlcov/ .coverage .coverage.*
    find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true

[testenv:release]
description = Build and check distribution
skip_install = true
deps =
    build>=1.2.0
    twine>=5.0.0
commands =
    python -m build
    twine check dist/*

[flake8]
max-line-length = 110
extend-ignore = E203, W503
exclude =
    .venv,
    .tox,
    build,
    dist,
    *.egg-info,
    .git,
    __pycache__,
    docs,
    examples